name: CI
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI {0}', inputs.ref || github.ref_name) || github.event.pull_request.title }}

# Not on pushes to master. Pull requests run it, and so does every version tag: tag.yaml dispatches this
# workflow on master with `ref` set to the tag. Only those runs on master save the Rust caches (a cache
# saved on master can be restored by every branch, pull request and tag); pull requests only restore them.
on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to test (empty = the head of the branch the run is started on). Run on master, it also refreshes the Rust caches.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Two tags dispatched on master one after the other must not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: cargo fmt --check
        run: cargo fmt --check --all

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-${{ matrix.os }}
          # Saved only by the runs dispatched on master (a version tag, or by hand). Those are rare, so a
          # failing test does not skip the refresh: the compiled dependencies are good either way.
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - name: Install Zig
        uses: $/.github/actions/setup-zig
        # The download picks a community mirror at random; one that hangs must not eat the job's hour.
        timeout-minutes: 10
      - name: Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          # libdbus: the keyring (but-secret). The rest: the gpui-kit GUI and the -sys crates. The
          # list is the one of the local Linux image (tools/dev/linux-test.ps1), where all of it was run.
          sudo ./scripts/install-minimal-debian-dependencies.sh
          sudo timeout 300 apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 libssl-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --workspace --all-targets
      # The GUI's documented build without Zig (no embedded terminal); nothing else builds it.
      - name: cargo check (gitcthulhu without the terminal)
        run: cargo check -p gitcthulhu --all-targets --no-default-features --features services
      # but-core still carries GitButler-era tests that depend on its legacy fixtures and environment; they are
      # slated for the slimming stage (decision D2) and must not hide regressions of the crates that are maintained.
      - name: cargo test
        # All of it: one failing test binary must not hide the failures of the crates after it.
        run: cargo test --workspace --exclude but-core --no-fail-fast
      - name: cargo test (but-core, legacy, non-blocking)
        continue-on-error: true
        run: cargo test -p but-core

  # The oldest Git the backend supports (spec 20 section 1.3): Ubuntu 22.04 ships 2.34.1. The backend
  # runs `git` for every mutation, so its suite is the one that can tell. Needs no Zig and no GUI packages.
  # It runs under a German locale (spec 20 section 10): Git's messages must stay English through the
  # executor's LANGUAGE=en, or the classifier would miss them. Ubuntu keeps git.mo in language-pack-de-base.
  # Locally: $env:LC_ALL = 'de_DE.UTF-8'; pwsh -NoProfile -File tools/dev/linux-test.ps1 --git-min test -p gitcthulhu-git
  git-min:
    name: gitcthulhu-git (Git 2.34.1, de_DE)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git zstd locales language-pack-de-base
          test "$(git --version)" = "git version 2.34.1"
          # The translations are there: without LANGUAGE=en this message is German.
          git init -q /tmp/locale-check
          if LC_ALL=de_DE.UTF-8 git -C /tmp/locale-check switch nosuch 2>&1 | grep -q 'invalid reference'; then
            echo "Git prints no German messages: the locale run would prove nothing."; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Rust toolchain
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Installs the toolchain of rust-toolchain.toml.
          "$HOME/.cargo/bin/rustup" toolchain install
      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-git-min
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - name: cargo test
        env:
          LC_ALL: de_DE.UTF-8
        run: cargo test -p gitcthulhu-git
