[package]
name = "but-testsupport"
version = "0.0.0"
edition.workspace = true
authors.workspace = true
publish = false
rust-version.workspace = true

[lib]
# One small unit test checks bash resolution.
test = true
doctest = false

[features]
## Make `snapbox` utilities available, generally useful for CLI testing.
snapbox = ["dep:snapbox"]

[dependencies]
but-core.workspace = true

gix-testtools.workspace = true
gix = { workspace = true, features = ["revision"] }
anyhow.workspace = true
termtree = "0.5.1"
regex = { workspace = true }
snapbox = { workspace = true, optional = true, features = ["regex"] }

[dev-dependencies]

[lints]
workspace = true
