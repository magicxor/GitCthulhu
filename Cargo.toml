[workspace]
members = [
    # Git core and shared foundations.
    "crates/but-core",           # Core types and capabilities for working with Git repositories.
    "crates/but-error",          # Error codes to communicate specific failures; JSON Error for frontends.
    "crates/but-serde",          # Serde attributes for serialisation and deserialisation of custom datatypes.
    "crates/but-schemars",       # `schemars` json schema generation utilities.
    "crates/but-project-handle", # Identify a project (repository) by its path.
    "crates/but-path",           # Provide paths interesting to the application, with global redirects for testing.
    "crates/but-utils",          # Filesystem and general utilities.
    "crates/but-testsupport",    # The foundation for all tests: fixtures, isolated environments, assertions.
    "crates/but-debugging",      # Debugging utilities that must not be relied upon by production code.

    # The plain Git backend, snapshot undo and the application services of the GUI.
    "crates/gitcthulhu-git",      # UI-agnostic plain Git backend: gix reads, `git` mutations, executor, graph layout.
    "crates/gitcthulhu-oplog",    # Snapshot-based undo/redo (operation log) on top of `but_core::snapshot`.
    "crates/gitcthulhu-services", # Forge, AI and update services shared by the GUI.
    "crates/gitcthulhu",          # The GitCthulhu GUI (gpui-kit): app, helper binaries (askpass, editor).

    # Git CLI executor, credential prompts and file watching.
    "crates/gitbutler-git",         # Run fetch/push/clone through the Git CLI, with askpass support (+ askpass binary).
    "crates/but-askpass",           # Broker prompts from Git back to the application.
    "crates/gitbutler-filemonitor", # Watch worktrees for changes (vendors a notify debouncer).

    # Preserved capabilities: forges, AI, embedded terminal, installer and updater.
    "crates/but-forge",         # A generalised interface to communicate with forges.
    "crates/but-forge-storage", # Storage of forge accounts.
    "crates/but-github",        # A thin wrapper of the GitHub API, for authentication and resource access.
    "crates/but-gitlab",        # A thin wrapper of the GitLab API, for authentication and resource access.
    "crates/but-bitbucket",     # A thin wrapper of the Bitbucket Cloud API, for authentication and resource access.
    "crates/but-secret",        # Retrieve and store secrets in the platform keychain.
    "crates/but-settings",      # Store and retrieve layered application settings, react to changes in realtime.
    "crates/but-db",            # Abstractions over Sqlite databases and caches.
    "crates/but-llm",           # LLM providers (Anthropic, OpenAI, Ollama, LM Studio, OpenRouter) and tool calling.
    "crates/but-tty",           # Embedded terminals (libghostty-vt), without a screen.
    "crates/but-installer",     # Installation binary.
    "crates/but-update",        # Retrieve information about available program versions to guide updates.
]
resolver = "2"

[workspace.package]
repository = "https://github.com/gitbutlerapp/gitbutler"
authors = ["GitButler <gitbutler@gitbutler.com>"]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
but-debugging = { path = "crates/but-debugging" }
but-testsupport = { path = "crates/but-testsupport" }
but-core = { path = "crates/but-core" }
but-db = { path = "crates/but-db" }
but-path = { path = "crates/but-path" }
but-github = { path = "crates/but-github" }
but-gitlab = { path = "crates/but-gitlab" }
but-bitbucket = { path = "crates/but-bitbucket" }
but-error = { path = "crates/but-error" }
but-serde = { path = "crates/but-serde" }
but-schemars = { path = "crates/but-schemars" }
but-update = { path = "crates/but-update" }
but-installer = { path = "crates/but-installer" }
but-secret = { path = "crates/but-secret" }
but-askpass = { path = "crates/but-askpass" }
but-project-handle = { path = "crates/but-project-handle" }
but-forge-storage = { path = "crates/but-forge-storage" }
but-settings = { path = "crates/but-settings" }
but-utils = { path = "crates/but-utils" }
but-forge = { path = "crates/but-forge" }
but-llm = { path = "crates/but-llm" }
but-tty = { path = "crates/but-tty" }
gitcthulhu-git = { path = "crates/gitcthulhu-git" }
gitcthulhu-oplog = { path = "crates/gitcthulhu-oplog" }
gitcthulhu-services = { path = "crates/gitcthulhu-services" }
gitbutler-git = { path = "crates/gitbutler-git" }
gitbutler-filemonitor = { path = "crates/gitbutler-filemonitor" }

# Bundled to ensure a consistent SQLite version across all platforms.
rusqlite = { version = "0.39.0", features = ["bundled"] }
backoff = "0.4.0"
bstr = "1.12.1"
# Add the `tracing` or `tracing-detail` features to see more of gitoxide in the logs. Useful to see which programs it invokes.
# When adjusting this, update `gix-testtools` as well!
gix = { version = "0.90.0", git = "https://github.com/GitoxideLabs/gitoxide", rev = "4dc73c31afa936828fca5bbf69ada5a94c480d43", default-features = false, features = [
    "sha1",
    "sha256",
    "anyhow",
    "auto-chain-error",
    "zlib-sirocco"
] }
gix-testtools = { version = "0.22.0", git = "https://github.com/GitoxideLabs/gitoxide", rev = "4dc73c31afa936828fca5bbf69ada5a94c480d43" }
git2 = { version = "0.21.0", features = [
    "unstable-sha256",
    "vendored-openssl",
    "vendored-libgit2",
] }
uuid = { version = "1.23", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive", "std"] }
serde_json = "1.0.148"
thiserror = "2.0.17"
tokio = { version = "1.50.0", default-features = false }
keyring = { version = "3.6.3", features = [
    "apple-native",
    "windows-native",
    "linux-native-async-persistent",
    # Keep synchronous keyring calls independent of callers' Tokio runtimes.
    "async-io",
    "crypto-rust",
] }
anyhow = "1.0.100"
parking_lot = "0.12.4"
boolean-enums = { version = "0.4.1", features = ["serde"] }
futures = "0.3.31"
toml = "0.9.10"
tracing = "0.1.44"
tempfile = "3.24"
rand = "0.9.3"
nix = "0.30.0"
libc = "0.2.189"
dirs = "6.0.0"
serde_json_lenient = "0.2.3"
reqwest = { version = "0.13.3", default-features = false, features = [
    "rustls",
    "json",
    "query",
    "stream",
] }
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
sha2 = "0.10"
base64 = "0.22"
notify = "8.2.0"
# TODO: use a release containing the no-follow APIs needed on Windows (notify-rs/notify#716).
file-id = { git = "https://github.com/notify-rs/notify", rev = "978fe719b066a8ce76b9a9d346546b1569eecfb6", version = "0.2.3" }
snapbox = { version = "0.6.23", features = ["json"] }
url = "2.5.7"
schemars = { version = "1.2.0", default-features = false, features = [
    "std",
    "derive",
    "uuid1",
    "preserve_order",
] }
async-openai = { version = "0.38.2", default-features = false, features = [
    "rustls",
    "chat-completion",
] }
open = "5.3.4"
regex = { version = "1.11.3", default-features = false, features = [
    "std",
    "unicode",
] }
sysinfo = { version = "0.37.2", default-features = false }
nonempty = "0.12.0"
unicode-segmentation = "1.13.2"
urlencoding = "2.1"
inventory = "0.3"
smallvec = "1.15.1"
bitflags = "2.13"
similar = "2.7"
infer = "0.19"
lru = "0.18"
semver = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry", "env-filter", "ansi"] }
encoding_rs = "0.8"
proptest = "1.7"

[patch.crates-io]
# Keep dependencies that use the crates.io `gix` on the same git revision as the workspace.
gix = { git = "https://github.com/GitoxideLabs/gitoxide", rev = "4dc73c31afa936828fca5bbf69ada5a94c480d43" }
git2 = { git = "https://github.com/gitbutlerapp/git2-rs", rev = "a87a7bb3f6843504339fe7434ee0732a3e968f3e" }

[workspace.lints.clippy]
# Note that `all` doesn't include everything, so extra lints should be added here.
# You can try `pedantic = deny` to see those extra lints (alongside `all`).
all = { level = "deny", priority = -1 }
# This comes mostly from `thiserror` in `gix`, and it's going to be converted
# to `Exn`, which will box erorrs and keep them small (much like `anyhow`).
result_large_err = "allow"
# These being `deny` is overly strict
unnecessary_mut_passed = "warn"
needless_borrow = "warn"
explicit_auto_deref = "warn"
uninlined_format_args = "warn"
# From `nursery`, so not in `all`: a clone of a value that's never used again, as when one is
# cloned into a closure that could have taken the value itself.
redundant_clone = "deny"

[profile.release]
# There are no overrides here as we optimise for fast release builds,
# which are used when building locally and when making Nightly builds.
# The Stable release builds override the relevant settings at release time
# to optimise for size.

[profile.bench]
codegen-units = 256
lto = false
opt-level = 3
debug = "line-tables-only"

# Incremental compilation stays ON in dev and test (cargo's default; it used to be disabled here).
# Only workspace crates are compiled incrementally, which is what agents iterating in a worktree
# rebuild all day. Measured on gitcthulhu-git (Windows, 12 cores, rebuild after a one-line change):
# `cargo check --all-targets` 5.4 s instead of 8.9 s, `cargo test --lib --no-run` 3.7 s instead of
# 8.3 s, all 32 test binaries `cargo test --no-run` 28 s instead of 38 s; a no-change run is the
# same (about 1 s). The price is the first build of a crate (check 14.6 s instead of 10.7 s) and
# target/debug/incremental, which the seed script skips; CI's rust-cache drops it too.
[profile.dev]
debug = "line-tables-only"

# Assure that `gix` is always fast so debug builds aren't unnecessarily slow.
[profile.dev.package]
# No debug info for dependencies (workspace crates keep line tables, see [profile.dev]): halves
# target/ and the PDBs and shortens linking, and panics and backtraces in workspace code still show
# file:line. A name-specific entry below still wins for the fields it sets. To debug into a
# dependency, set `debug = true` for that package here.
"*" = { debug = false }
foldhash = { opt-level = 3 }
gix-imara-diff = { opt-level = 3 }
gix = { opt-level = 3 }
gix-diff = { opt-level = 3 }
gix-glob = { opt-level = 3 }
gix-attributes = { opt-level = 3 }
gix-ignore = { opt-level = 3 }
chardetng = { opt-level = 3 }
gix-index = { opt-level = 3 }
gix-odb = { opt-level = 3 }
gix-object = { opt-level = 3 }
gix-ref = { opt-level = 3 }
gix-pack = { opt-level = 3 }
gix-hash = { opt-level = 3 }
gix-actor = { opt-level = 3 }
gix-config = { opt-level = 3 }
gix-worktree = { opt-level = 3 }
sha1dc = { opt-level = 3 }
zlib-rs = { opt-level = 3 }
sirocco = { opt-level = 3 }
adler32furious = { opt-level = 3 }
serde = { opt-level = 3 }
serde_json = { opt-level = 3 }
# Its build script picks Zig's Debug mode from `debug`, whatever `opt-level` says, and that
# verifies the whole page for every cell a terminal prints in a hyperlink.
libghostty-vt-sys = { opt-level = 3, debug = false }
# GUI rendering and text shaping are slow unoptimised (gpui-kit cheat sheet, 10 §1.1).
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
gpui-pre-windows = { opt-level = 3 }
gpui-pre-macos = { opt-level = 3 }
gpui-pre-linux = { opt-level = 3 }
gpui-pre-wgpu = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
taffy = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
resvg = { opt-level = 3 }
smol = { opt-level = 3 }
syntect = { opt-level = 3 }
fancy-regex = { opt-level = 3 }
# This one is special as we can run into debug assertions otherwise.
# They have a time, but let's chose the time instead of always being hit by it.
gix-merge = { opt-level = 3, debug-assertions = false }

[profile.release.package.but-installer]
opt-level = "z" # Optimize for size instead of speed
strip = true    # Strip symbols from binary

# Terminal rendering by the embedded terminal (libghostty-vt) is slow unoptimised.
[profile.release.package]
libghostty-vt-sys = { opt-level = 3, debug = false }
