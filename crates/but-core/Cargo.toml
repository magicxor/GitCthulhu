[package]
name = "but-core"
version = "0.0.0"
edition.workspace = true
authors.workspace = true
publish = false
rust-version.workspace = true
description = "A leaf-crate with core Git algorithms and types"

[lib]
doctest = false

[dependencies]
but-error.workspace = true
but-serde.workspace = true


nonempty.workspace = true
serde.workspace = true
bstr.workspace = true
tracing.workspace = true
anyhow.workspace = true
gix = { workspace = true, features = [
    "dirwalk",
    "credentials",
    "parallel",
    "serde",
    "status",
    "merge",
    "worktree-mutation",
] }
chardetng = "0.1.17"

# for `id`
uuid.workspace = true

boolean-enums.workspace = true

# for staging checkout files before moving them into the worktree
tempfile.workspace = true

# for `sync`
fslock = "0.2.1"
parking_lot = { workspace = true, features = ["arc_lock"] }

[dev-dependencies]
but-testsupport.workspace = true
gix = { workspace = true, features = ["revision"] }
serde_json = "1.0"
snapbox.workspace = true

[lints]
workspace = true
